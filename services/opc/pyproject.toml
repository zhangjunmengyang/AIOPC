[project]
name = "aiopc-opc"
version = "0.1.0"
description = "AIOPC 的业务服务：项目、账号、发布、素材与数据，同时供 AI（MCP）和应用页面（HTTP）使用"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "httpx>=0.27",
  "filelock>=3.12",
  "python-dotenv>=1.0",
  "websockets>=13",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiopc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 140
