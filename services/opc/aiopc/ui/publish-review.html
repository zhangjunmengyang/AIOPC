<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>确认稿件</title>
<style>
:root{color-scheme:light dark;font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#242424,#eee);background:transparent}body{margin:0;padding:20px}header{display:flex;justify-content:space-between;gap:12px}h1{font-size:18px;margin:0 0 12px}small,#status{color:light-dark(#666,#aaa)}#text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;margin:14px 0}#media{display:flex;flex-wrap:wrap;gap:8px}figure{margin:0;max-width:180px}img{width:100%;max-height:200px;object-fit:contain;border-radius:8px}figcaption{font-size:12px;overflow-wrap:anywhere}footer{display:flex;gap:8px;align-items:center;margin-top:18px}button{font:inherit;border:1px solid light-dark(#d6d6d6,#555);border-radius:8px;padding:7px 13px;background:light-dark(#fff,#222);color:inherit;cursor:pointer}button.primary{background:light-dark(#222,#eee);color:light-dark(#fff,#222);border-color:transparent}button:disabled{opacity:.45;cursor:default}#status{margin:12px 0 0}#tags{color:light-dark(#666,#aaa)}
</style>
<header><small id="account">正在载入稿件…</small><small>稿件审批</small></header>
<h1 id="title"></h1><div id="text"></div><div id="tags"></div><div id="media"></div>
<footer><button id="approve" class="primary" disabled>确认并填写发布页</button><button id="reject" disabled>退回修改</button></footer>
<p id="status" role="status">填写完成后，仍需你在平台点击发布。</p>
<script>
let sequence=0,review=null,busy=false;const pending=new Map();const el=id=>document.getElementById(id);
function notify(method,params){parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function call(method,params){const id=++sequence;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function buttons(disabled){el('approve').disabled=disabled;el('reject').disabled=disabled}
function show(result){const data=result.structuredContent;if(!data?.id||!data.payload)return;review=data;el('account').textContent=data.platform+' · '+data.account;el('title').textContent=data.payload.title||'待确认稿件';el('text').textContent=data.payload.text;el('tags').textContent=data.payload.tags.map(tag=>'#'+tag).join(' ');el('media').replaceChildren();for(const item of result._meta?.media||[]){const figure=document.createElement('figure');if(item.preview){const img=document.createElement('img');img.src=item.preview;img.alt=item.name;figure.append(img)}const label=document.createElement('figcaption');label.textContent=item.name;figure.append(label);el('media').append(figure)}buttons(data.status!=='awaiting_approval');}
window.addEventListener('message',event=>{if(event.source!==parent)return;const message=event.data;if(message?.jsonrpc!=='2.0')return;if(message.id&&pending.has(message.id)){const entry=pending.get(message.id);pending.delete(message.id);message.error?entry.reject(new Error(message.error.message)):entry.resolve(message.result)}else if(message.method==='ui/notifications/tool-result')show(message.params)});
async function decide(decision){if(!review||busy)return;busy=true;buttons(true);el('status').textContent=decision==='approve'?'正在确认并填写发布页…':'正在退回…';try{const result=await call('tools/call',{name:'social_confirm_publish',_meta:{'openwork/userInteraction':true},arguments:{review_id:review.id,revision:review.digest,decision}});if(result.isError)throw new Error(result.content?.filter(x=>x.type==='text').map(x=>x.text).join('\n')||'操作失败');const data=result.structuredContent||JSON.parse(result.content.find(x=>x.type==='text').text);el('status').textContent=data.message||'已处理';notify('ui/notifications/size-changed',{height:document.documentElement.scrollHeight});}catch(error){el('status').textContent=error.message;buttons(false)}finally{busy=false}}
el('approve').onclick=()=>decide('approve');el('reject').onclick=()=>decide('reject');
new ResizeObserver(()=>notify('ui/notifications/size-changed',{height:document.documentElement.scrollHeight})).observe(document.body);
call('ui/initialize',{appInfo:{name:'AIOPC 稿件审批',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>notify('ui/notifications/initialized',{})).catch(error=>{el('status').textContent=error.message});
</script></html>
