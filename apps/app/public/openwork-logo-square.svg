<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2140"/>
      <stop offset="1" stop-color="#2E2470"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A1A"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  </g>
  <!-- The company: a ring left open toward the top right. -->
  <path d="M 638 330 A 210 210 0 1 0 718 470" fill="none" stroke="#FFFFFF" stroke-width="92" stroke-linecap="round"/>
  <!-- One person, carrying the idea out. -->
  <circle cx="712" cy="318" r="66" fill="url(#spark)"/>
</svg>
